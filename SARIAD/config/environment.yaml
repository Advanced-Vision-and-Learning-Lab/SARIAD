# Conda environment for SARIAD development
#
#   conda env create -f SARIAD/config/environment.yaml   (run from the repository root)
#   conda activate SARIAD
#
# Mirrors pyproject.toml (Python >= 3.13, anomalib >= 2.6.2). Install a CUDA build of
# PyTorch afterwards if you have a GPU, e.g.:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126
name: SARIAD

channels:
  - conda-forge

dependencies:
  - python=3.13
  - pip
  - pip:
    - torch>=2.7.1
    - torchvision>=0.22.1
    - anomalib[loggers]>=2.6.2
    - ultralytics>=8.4
    - -e .[dev,docs]
