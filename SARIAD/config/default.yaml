# SARIAD experiment configuration
#
#   python -m SARIAD.config.run --config SARIAD/config/default.yaml --dry-run   # validate only
#   python -m SARIAD.config.run --config SARIAD/config/default.yaml             # run everything
#
# Every name below must exist: datasets in SARIAD.datasets, models in SARIAD.models or
# anomalib.models, preprocessors in SARIAD.pre_processing. The parameters listed under
# `datasets`, `models` and `preprocessors` are passed to that class' constructor, so they must
# be arguments it accepts (`--dry-run` checks this).

# Global settings
seed: 42               # run i of an experiment uses seed + i
benchmark_runs: 3      # default number of repetitions per experiment (override with `runs:`)
output_dir: "results"  # predictions, metrics and comparison_table.tex are written here

# The experiments to run. Each entry is a complete train + predict + evaluate pipeline.
experiments:
  - name: "Padim_on_MSTAR_without_preproc"
    dataset: MSTAR
    preprocessor: null
    model: Padim

  - name: "Padim_on_MSTAR_with_NLM_preproc"
    dataset: MSTAR
    preprocessor: NLM
    model: Padim

  - name: "Padim_on_MSTAR_with_MF_preproc"
    dataset: MSTAR
    preprocessor: MedianFilter
    model: Padim

  # More combinations. Any anomalib model works (Patchcore, EfficientAd, Dinomaly, AnomalyDino,
  # InpFormer, Glass, WinClip, ...), as do SARIAD's own (SARATRX, YOLOAnomaly).
  # - name: "Patchcore_on_SSDD"
  #   dataset: SSDD
  #   preprocessor: MedianFilter
  #   model: Patchcore
  #   runs: 1
  #
  # - name: "SARATRX_on_MSTAR"
  #   dataset: MSTAR
  #   preprocessor: null
  #   model: SARATRX

# Constructor parameters
datasets:
  MSTAR:
    batch_size: 32
    num_workers: 4
    # path: "/data/PLMSTAR"   # where the dataset lives (default: <SARIAD_DATASETS_PATH>/PLMSTAR)
  HRSID:
    batch_size: 16
    num_workers: 2
  SSDD:
    batch_size: 16
    num_workers: 2

models:
  Padim: null
  # SARATRX:
  #   mask_ratio: 0.75

preprocessors:
  NLM:
    std: 0.1
    kernel_size: 21
  MedianFilter:
    kernel_size: 3
