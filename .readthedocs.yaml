version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_create_environment:
      # CPU-only PyTorch: the docs only import the code, and the CUDA wheels are several GB
      - pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

submodules:
  include: all
  recursive: false

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
